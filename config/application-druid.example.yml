# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 时区：必须同时钉住"驱动写入时用的时区"和"MySQL 会话时区"，否则
            #   Java 的 new Date() 与 SQL 里的 sysdate() 会写出相差若干小时的两个值，
            #   同一行里 submit_time 和 create_time 都对不上，按日期筛选会大面积漏数据。
            #   serverTimezone 决定驱动怎么把 java.util.Date 转成 DATETIME；
            #   sessionVariables 把 MySQL 会话时区也钉成同一个偏移，
            #   让 now()/sysdate() 与 Java 侧落在同一个时钟上。
            #   这里刻意用数值偏移 +08:00 而不是 Asia/Shanghai：
            #   MySQL 的时区表（mysql.time_zone_name）默认是空的，没执行过
            #   mysql_tzinfo_to_sql 的实例用命名时区会直接报
            #   "Unknown or incorrect time zone"，连接池起不来。数值偏移永远可用。
            # 主库数据源
            #
            # 这里给了带 sessionVariables 的默认值，而不是裸 ${DB_URL}：
            # 时区必须钉在连接串上，只写注释提醒是不够的 —— 运维沿用一份旧的
            # DB_URL 就会静默丢掉它，Java 与 MySQL 又会相差若干小时，而且不报错。
            # 自定义 DB_URL 时请务必保留 sessionVariables=time_zone='+08:00'。
            master:
                url: ${DB_URL:jdbc:mysql://localhost:3306/dkxy?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&sessionVariables=time_zone%3D'%2B08%3A00'}
                username: ${DB_USERNAME}
                password: ${DB_PASSWORD}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: ${DB_URL:jdbc:mysql://localhost:3306/dkxy?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&sessionVariables=time_zone%3D'%2B08%3A00'}
                username: ${DB_USERNAME}
                password: ${DB_PASSWORD}
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                enabled: false
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ${DRUID_USERNAME}
                login-password: ${DRUID_PASSWORD}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true