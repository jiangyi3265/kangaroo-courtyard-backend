# 项目相关配置
ruoyi:
  # 名称
  name: 管理系统
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${UPLOAD_PATH:./uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 序列化时区与 JVM、数据库会话保持一致，避免下发给前端的时间再偏一次
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    # 袋鼠小院建议单独占一个索引（本机 0 号库常被其他项目占用，会造成登录态互相踩踏）
    database: ${REDIS_DATABASE:0}
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${JWT_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 袋鼠小院业务配置
kangaroo:
  # 商家房费提现，复用现有微信支付商户配置。先执行 V83 迁移。
  pay:
    wechat:
      transfer:
        enabled: ${KANGAROO_WX_TRANSFER_ENABLED:false}
        # 使用商户平台获批的转账场景及报备字段，报备信息为 JSON 数组。
        scene-id: ${KANGAROO_WX_TRANSFER_SCENE_ID:}
        scene-report-infos: ${KANGAROO_WX_TRANSFER_SCENE_REPORT_INFOS:[]}
  # AI评价是独立的模型参考分；原住客统计仍保留。默认关闭，完整配置后才启用。
  # endpoint 是完整的 HTTPS /chat/completions 地址。API key 只在服务器环境配置。
  review-ai:
    enabled: ${KG_REVIEW_AI_ENABLED:false}
    endpoint: ${KG_REVIEW_AI_ENDPOINT:}
    api-key: ${KG_REVIEW_AI_API_KEY:}
    model: ${KG_REVIEW_AI_MODEL:}
    daily-limit: ${KG_REVIEW_AI_DAILY_LIMIT:30}
    hourly-limit: ${KG_REVIEW_AI_HOURLY_LIMIT:5}
    timeout-ms: 15000
  # 小程序登录令牌有效期（分钟），默认 7 天
  token:
    expireTime: 10080
  # 商家确认录用的时限（小时）。页面文案为 24 小时。
  confirm-deadline-hours: 24
  wx:
    # 本地联调开关：为 true 时不调用微信服务器，直接把 code 当 openid。
    # 生产环境必须为 false —— 开启后任何人都能用任意 code 冒充任意账号。
    # 启动时的守卫：为 true 时，数据源必须指向本机（localhost / 127.0.0.1），
    # 否则 @PostConstruct 直接抛异常，应用起不来。
    # （代码里还留着一条"prod/production profile 下拒绝启动"的判据，但本项目靠 druid
    #   这个 profile 加载数据源，active profile 永远是 druid，那一条不会触发。）
    mock-enabled: false

# 微信小程序凭证从环境变量读取，不写进任何配置文件：
#   KANGAROO_WX_APPID   小程序 AppID
#   KANGAROO_WX_SECRET  小程序 AppSecret
# 未配置时 /app/auth/wx-login 会明确返回"微信登录尚未配置"，不会静默降级成假登录。
